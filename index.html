 else if(!d)low=need+(niwa?'':inp('in1','上の句（五・七・五）'))+inp('in2','下の句（七・七）')+'<p class="msg" id="msg"></p><span id="cnt"></span><button class="btn" onclick="cast()">詠む</button>';
 else{const f=d.song.fav,kw=d.found.map(w=>w[0]).slice(0,3).join('・');low=`<p class="bonus">${niwa?'上の句の季語':'季語'}「${E(kw)}」　雅 ＋${d.pts}</p><div class="rowb"><button class="btn" onclick="start('${m}')">次の歌へ</button><button class="ghost" onclick="fav(${d.song.id})">${f?'★ しおり済':'☆ しおり'}</button></div>`}

 st.mode=mode;st.done=null;st.fresh=false;clearTimeout(st.qt);st.run=false;st.miss=false;st.f=null;
 if(mode=='niwa'){st.verse=rnd(V.filter(v=>v!==st.verse));st.poet=rnd(POETS);const f=kg(st.verse[1].join(''),st.verse[0]);st.kw=f[0]?f[0][0]:'';setSeason(st.verse[0]);st.chips=[]}
 else{st.verse=null;setSeason(curSeason());st.chips=[...K[curSeason()]].sort(()=>Math.random()-.5).slice(0,3).map(k=>k[0])}

function cast(){
 const m=st.mode,niwa=m=='niwa',say=t=>{const e=$('#msg');if(e)e.textContent=t};
 let a;
 if(niwa)a=st.verse[1];else{const t1=$('#in1').value.trim();if(!t1){say('上の句を入れてください');$('#in1').focus();return}a=sp(t1,[5,7,5])}
 const t2=$('#in2').value.trim();if(!t2){say('下の句を入れてください');$('#in2').focus();return}
 const b=sp(t2,[7,7]);let found;
 if(niwa)found=kg(a.join(''),st.verse[0]);
 else{found=kg(a.join('')+b.join(''));if(!found.length){say('季語が見当たりません。図録で探してみましょう。');return}}
 clearTimeout(st.qt);
 const pts=PT[m],se=niwa?st.verse[0]:found[0][3];
 const song={id:Date.now(),a,b,mode:m,s:se,k:found[0]?found[0][0]:'',fav:false};
 st.hist.unshift(song);trim();st.pts+=pts;save();
 st.done={song,found,pts};setSeason(se);st.fresh=true;render();
 const r=$('#fuda').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,niwa?1:2);
 st.fresh=false}
function trim(){let n=st.hist.filter(h=>!h.fav).length;while(n>50){let i=st.hist.length-1;while(i>=0&&st.hist[i].fav)i--;if(i<0)break;st.hist.splice(i,1);n--}}

let W0=0,H0=0,lVH=-1,lVT=-1;
function fit(){const w=innerWidth,h=innerHeight;if(w!==W0){W0=w;H0=h}else if(h>H0)H0=h;document.documentElement.style.setProperty('--H',H0+'px')}
function adj(){const i=document.activeElement;if(!i||i.tagName!='INPUT')return;const v=window.visualViewport,b=v?v.offsetTop+v.height:innerHeight,r=i.getBoundingClientRect();if(r.bottom+80>b)scrollBy({top:r.bottom+80-b,behavior:'smooth'})}
function vp(){const v=window.visualViewport,VH=v?v.height:innerHeight,VT=v?v.offsetTop:0;
 if(VH!==lVH||VT!==lVT){lVH=VH;lVT=VT;const r=document.documentElement.style;r.setProperty('--VH',VH+'px');r.setProperty('--VT',VT+'px');r.setProperty('--KB',Math.max(0,innerHeight-VH-VT)+'px');const ai=document.activeElement,kb=H0-VH>120&&!!ai&&/^in[12]$/.test(ai.id);if(kb!==document.body.classList.contains('kb')){document.body.classList.toggle('kb',kb);if(kb)setTimeout(adj,300)}}
 const c=document.querySelector('.cup');if(c)c.style.transform='translateY('+(-70+Math.min(1,(performance.now()-st.t0)/QT)*(VH+90))+'px)'}
function rs(){fit();const d=Math.min(devicePixelRatio||1,2);W=W0;H=H0;for(const [c,x] of [[cv,cx],[cv2,cx2]]){c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}}
const mk=y=>({x:Math.random()*W,y:y??Math.random()*H,vx:.3+Math.random()*.8,vy:.4+Math.random()*.8,r:3+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.05,ph:Math.random()*6});
function init(){rs();P=Array.from({length:RM?5:14},()=>mk());WS=Array.from({length:RM?0:2},()=>({x:Math.random()*W,y:Math.random()*H,l:90+Math.random()*120,s:1.2+Math.random()*1.2}))}
function burst(x,y,m){const n=RM?0:Math.round(12*m),col=['#5f8a5a','#7da06a','#4c7350','#8fae6e'];
 for(let i=0;i<n;i++)G.push({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.3)*.6,vy:.7+Math.random()*.9,a:Math.random()*6.28,va:(Math.random()-.5)*.03,len:10+Math.random()*8,ph:Math.random()*6,life:1,c:rnd(col)})}
function loop(){vp();
 cx.clearRect(0,0,W,H);const cs=PC[season];
 cx.strokeStyle='rgba(255,255,255,.22)';cx.lineWidth=1.2;
 for(const w of WS){w.x+=w.s;if(w.x-w.l>W){w.x=-20;w.y=Math.random()*H}cx.beginPath();cx.moveTo(w.x-w.l,w.y);cx.bezierCurveTo(w.x-w.l*.6,w.y-14,w.x-w.l*.3,w.y+14,w.x,w.y-4);cx.stroke()}
 P.forEach((p,i)=>{p.ph+=.02;p.x+=p.vx+Math.sin(p.ph)*.5;p.y+=season=='夏'?Math.sin(p.ph)*.4:p.vy;p.a+=p.va;
  if(p.x>W+10||p.y>H+10){P[i]=mk(-10);P[i].x=Math.random()*W*.9}
  cx.fillStyle=cs[i%cs.length];cx.save();cx.translate(p.x,p.y);
  if(season=='夏'){cx.globalAlpha=.4+.5*Math.sin(p.ph*2);cx.shadowColor='#e8f59a';cx.shadowBlur=12;cx.beginPath();cx.arc(0,0,2.5,0,6.3);cx.fill()}
  else if(season=='冬'){cx.globalAlpha=.85;cx.beginPath();cx.arc(0,0,p.r*.6,0,6.3);cx.fill()}
  else{cx.globalAlpha=.55;cx.rotate(p.a);cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55,0,0,6.3);cx.fill()}
  cx.restore()});
 cx2.clearRect(0,0,W,H);for(let i=G.length-1;i>=0;i--){const g=G[i];g.ph+=.02;g.x+=g.vx+Math.sin(g.ph)*.6;g.y+=g.vy;g.a+=g.va;if(g.y>0)g.life-=.003;if(g.life<=0||g.y>H+30){G.splice(i,1);continue}
  cx2.save();cx2.globalAlpha=Math.min(1,g.life*1.2)*.8;cx2.translate(g.x,g.y);cx2.rotate(g.a+Math.sin(g.ph)*.5);cx2.fillStyle=g.c;cx2.beginPath();cx2.moveTo(-g.len,0);cx2.quadraticCurveTo(0,-g.len*.32,g.len,0);cx2.quadraticCurveTo(0,g.len*.2,-g.len,0);cx2.fill();cx2.restore()}
 requestAnimationFrame(loop)}

addEventListener('resize',()=>{const a=W0,b=H0;fit();if(W0!==a||H0!==b)rs()});
setSeason(season);init();render();loop();
</script>
</body>
</html>
